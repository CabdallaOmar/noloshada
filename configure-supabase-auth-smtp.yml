name: Configure Supabase signup email

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure-auth-smtp:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN Actions secret.'; exit 1; }
          test -n "$SMTP_USER" || { echo 'Missing SMTP_USER Actions secret.'; exit 1; }
          test -n "$SMTP_PASS" || { echo 'Missing SMTP_PASS Actions secret.'; exit 1; }

      - name: Enable Gmail SMTP for Supabase Auth
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SUPABASE_PROJECT_REF: ydsvgydojsjdzgxlwnen
        run: |
          confirmation_subject='Noloshaada email verification code'
          confirmation_content='<h2>Verify your email</h2><p>Enter this six-digit code to finish creating your Noloshaada account:</p><p style="font-size:28px;font-weight:700;letter-spacing:0.25em">{{ .Token }}</p><p>If you did not request this code, you can ignore this email.</p>'
          payload=$(jq -n \
            --arg user "$SMTP_USER" \
            --arg pass "$SMTP_PASS" \
            --arg subject "$confirmation_subject" \
            --arg template "$confirmation_content" \
            '{external_email_enabled:true, mailer_autoconfirm:false, smtp_admin_email:$user, smtp_host:"smtp.gmail.com", smtp_port:465, smtp_user:$user, smtp_pass:($pass | gsub("\\s";"")), smtp_sender_name:"Noloshaada", mailer_subjects_confirmation:$subject, mailer_templates_confirmation_content:$template}')
          curl --fail-with-body --silent --show-error \
            --request PATCH "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            --output /dev/null
          echo 'Supabase Auth SMTP configured; email confirmation remains required.'
